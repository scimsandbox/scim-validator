# RFC 9967 — System for Cross-Domain Identity Management (SCIM) Profile for Security Event Tokens (SETs)
# Basis: RFC 9967 (May 2026)
# Stable IDs follow: RFC9967-<section>-<sequence>

- id: RFC9967-2.5.1.1-R1
  rfc: "9967"
  section: "2.5.1.1"
  title: "Clients MAY request asynchronous processing using Prefer: respond-async header"
  level: MAY
  capability: async
  observability: response
  disposition: tested
  note: "Clients initiate async processing on POST, PUT, PATCH, DELETE with Prefer: respond-async (RFC 7240 §4.1, RFC 9967 §2.5.1.1)"

- id: RFC9967-2.5.1.1-R2
  rfc: "9967"
  section: "2.5.1.1"
  title: "Asynchronous response returns HTTP 202 Accepted with no response body"
  level: MUST
  capability: async
  observability: response
  disposition: tested
  note: "When returning HTTP status code 202 (Accepted), the response MUST contain no response body (RFC 9967 §2.5.1.1, §3)"

- id: RFC9967-2.5.1.1-R3
  rfc: "9967"
  section: "2.5.1.1"
  title: "Asynchronous 202 response MUST include Location header"
  level: MUST
  capability: async
  observability: response
  disposition: tested
  note: "Location header value MUST be either a URI where completion SET may be retrieved via GET or normal SCIM resource location (RFC 9967 §2.5.1.1)"

- id: RFC9967-3-R1
  rfc: "9967"
  section: "3"
  title: "Set-Txn HTTP response header MUST be returned on 202 Accepted response"
  level: MUST
  capability: async
  observability: response
  disposition: tested
  note: "Set-Txn header field MUST be used in SCIM responses when HTTP status code 202 is returned (RFC 9967 §3)"

- id: RFC9967-4-R1
  rfc: "9967"
  section: "4"
  title: "ServiceProviderConfig advertises securityEvents discovery schema"
  level: OPTIONAL
  capability: async
  observability: response
  disposition: tested
  note: "securityEvents.asyncRequest specifies 'none', 'long', or 'request' (RFC 9967 §4)"
