# RFC 7644: SCIM Protocol Specification Requirements Catalog
# Basis: RFC 7644 as published (September 2015) + Verified Errata (6893, 7898, 7916, 8096, 8365)
# Date: 2026-10-10

- id: RFC7644-2-R1
  rfc: "7644"
  section: "2"
  title: "Missing or invalid credentials return HTTP 401 with WWW-Authenticate header"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "RFC 7644 §2 references RFC 7235 §4.1 for WWW-Authenticate header"

- id: RFC7644-2-R2
  rfc: "7644"
  section: "3.12"
  title: "Forbidden operations return HTTP 403 Forbidden"
  level: SHOULD
  capability: none
  observability: response
  disposition: tested
  note: "RFC 7644 §3.12 Table 8 & §4: 403 Forbidden on disallowed operations (e.g., filtering on discovery endpoints or sensitive attributes); verified in DSC_19 and NEG_23"

- id: RFC7644-3.1-R1
  rfc: "7644"
  section: "3.1"
  title: "SCIM message schemas SHALL NOT be discoverable using the /Schemas endpoint"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "ListResponse, PatchOp, BulkRequest, BulkResponse, Error, SearchRequest schemas absent from /Schemas"

- id: RFC7644-3.2-R1
  rfc: "7644"
  section: "3.2"
  title: "HTTP methods follow SCIM endpoint action table semantics"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "GET retrieves, POST creates, PUT replaces, PATCH updates, DELETE removes"

- id: RFC7644-3.2-R2
  rfc: "7644"
  section: "3.2"
  title: "PUT MUST NOT be used to create new resources"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "PUT targeting non-existent resource returns 404 Not Found"

- id: RFC7644-3.3-R1
  rfc: "7644"
  section: "3.3"
  title: "Successful resource creation returns HTTP 201 with Location header and representation"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Location header MUST match resource URI and body includes meta.resourceType"

- id: RFC7644-3.3-R2
  rfc: "7644"
  section: "3.3"
  title: "Duplicate resource creation returns HTTP 409 Conflict with scimType uniqueness"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Attempting to create resource with existing unique attribute (e.g. userName) fails with 409"

- id: RFC7644-3.3-R3
  rfc: "7644"
  section: "3.3"
  title: "Missing required attributes in POST returns HTTP 400 Bad Request"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Creating User without userName or Group without displayName returns 400"

- id: RFC7644-3.3-R4
  rfc: "7644"
  section: "3.3"
  title: "Client-supplied readOnly attributes supplied on create SHALL be ignored"
  level: MUST
  capability: none
  observability: behavior
  disposition: tested
  note: "Client-supplied id, meta.created, or groups on User POST are ignored or rejected"

- id: RFC7644-3.3-R5
  rfc: "7644"
  section: "3.3"
  title: "Null or empty array in POST clears or unassigns attribute"
  level: MAY
  capability: none
  observability: behavior
  disposition: tested
  note: "Specifying null for single-valued or [] for multi-valued attribute clears attribute"

- id: RFC7644-3.4-R1
  rfc: "7644"
  section: "3.4"
  title: "Default returned attributes are those whose characteristic returned is always or default"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Unrequested responses omit returned=never and returned=request attributes"

- id: RFC7644-3.4.1-R1
  rfc: "7644"
  section: "3.4.1"
  title: "GET resource by ID returns HTTP 200 with resource representation"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Retrieves existing User or Group by ID"

- id: RFC7644-3.4.1-R2
  rfc: "7644"
  section: "3.4.1"
  title: "GET resource with unknown ID returns HTTP 404 with Error response"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Non-existent resource returns 404 and SCIM Error body"

- id: RFC7644-3.4.2-R1
  rfc: "7644"
  section: "3.4.2"
  title: "Query response returns HTTP 200 with ListResponse schema and totalResults"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Response contains urn:ietf:params:scim:api:messages:2.0:ListResponse"

- id: RFC7644-3.4.2-R2
  rfc: "7644"
  section: "3.4.2"
  title: "Query with no matches returns HTTP 200 with totalResults 0 and empty or omitted Resources"
  level: MUST
  capability: filter
  observability: response
  disposition: optional
  note: "Empty result set is 200 OK (not 404) with totalResults=0 and Resources=[] or omitted"

- id: RFC7644-3.4.2-R3
  rfc: "7644"
  section: "3.4.2"
  title: "Unrecognized query parameters SHOULD be ignored"
  level: SHOULD
  capability: none
  observability: behavior
  disposition: tested
  note: "Unknown query parameters do not cause query rejection"

- id: RFC7644-3.4.2-R4
  rfc: "7644"
  section: "3.4.2"
  title: "Resources element is REQUIRED in ListResponse when totalResults is non-zero"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "When totalResults > 0 (and requested count != 0), Resources array must be present"

- id: RFC7644-3.4.2.1-R1
  rfc: "7644"
  section: "3.4.2.1"
  title: "Query against server root indicates all resources included and meta.resourceType filter restricts results"
  level: MAY
  capability: search
  observability: response
  disposition: optional
  note: "Root query / returns all types; filter=meta.resourceType eq User limits results"

- id: RFC7644-3.4.2.1-R2
  rfc: "7644"
  section: "3.4.2.1"
  title: "Query exceeding server result limit returns HTTP 400 with scimType tooMany"
  level: SHOULD
  capability: filter
  observability: response
  disposition: optional
  note: "Returns 400 tooMany when matching results exceed filter.maxResults"

- id: RFC7644-3.4.2.2-R1
  rfc: "7644"
  section: "3.4.2.2"
  title: "Filter eq operator returns exact match respecting caseExact"
  level: MUST
  capability: filter
  observability: response
  disposition: optional
  note: "Matches exact value; case sensitive only when attribute is caseExact=true"

- id: RFC7644-3.4.2.2-R2
  rfc: "7644"
  section: "3.4.2.2"
  title: "Filter ne operator returns non-matching resources"
  level: MUST
  capability: filter
  observability: response
  disposition: optional
  note: "Returns resources where attribute is not equal or not present"

- id: RFC7644-3.4.2.2-R3
  rfc: "7644"
  section: "3.4.2.2"
  title: "Filter co operator returns substring match"
  level: MUST
  capability: filter
  observability: response
  disposition: optional
  note: "Substring contains comparison"

- id: RFC7644-3.4.2.2-R4
  rfc: "7644"
  section: "3.4.2.2"
  title: "Filter sw operator returns prefix match"
  level: MUST
  capability: filter
  observability: response
  disposition: optional
  note: "Starts with comparison"

- id: RFC7644-3.4.2.2-R5
  rfc: "7644"
  section: "3.4.2.2"
  title: "Filter ew operator returns suffix match"
  level: MUST
  capability: filter
  observability: response
  disposition: optional
  note: "Ends with comparison"

- id: RFC7644-3.4.2.2-R6
  rfc: "7644"
  section: "3.4.2.2"
  title: "Filter pr operator returns resources where attribute is present and non-null"
  level: MUST
  capability: filter
  observability: response
  disposition: optional
  note: "Presence check"

- id: RFC7644-3.4.2.2-R7
  rfc: "7644"
  section: "3.4.2.2"
  title: "Filter gt, ge, lt, le comparison operators match ordered values"
  level: MUST
  capability: filter
  observability: response
  disposition: optional
  note: "Greater than, greater than or equal, less than, less than or equal comparisons"

- id: RFC7644-3.4.2.2-R8
  rfc: "7644"
  section: "3.4.2.2"
  title: "Filter and operator requires both expressions evaluate to true"
  level: MUST
  capability: filter
  observability: response
  disposition: optional
  note: "Logical conjunction"

- id: RFC7644-3.4.2.2-R9
  rfc: "7644"
  section: "3.4.2.2"
  title: "Filter or operator requires at least one expression evaluates to true"
  level: MUST
  capability: filter
  observability: response
  disposition: optional
  note: "Logical disjunction"

- id: RFC7644-3.4.2.2-R10
  rfc: "7644"
  section: "3.4.2.2"
  title: "Filter not operator inverts expression result"
  level: MUST
  capability: filter
  observability: response
  disposition: optional
  note: "Logical negation"

- id: RFC7644-3.4.2.2-R11
  rfc: "7644"
  section: "3.4.2.2"
  title: "Filter parentheses group expressions to alter operator precedence"
  level: MUST
  capability: filter
  observability: response
  disposition: optional
  note: "Precedence grouping"

- id: RFC7644-3.4.2.2-R12
  rfc: "7644"
  section: "3.4.2.2"
  title: "Value path filter matches items within multi-valued complex attributes"
  level: MUST
  capability: filter
  observability: response
  disposition: optional
  note: "RFC 7644 §3.4.2.2 Table 5: When complex bracket filters are supported, expressions within square brackets MUST be applied to the same value of the parent attribute (e.g. emails[type eq \"work\" and value co \"@example.com\"])"

- id: RFC7644-3.4.2.2-R13
  rfc: "7644"
  section: "3.4.2.2"
  title: "Filter on schemas attribute matches resources declaring schema URN"
  level: MUST
  capability: filter
  observability: response
  disposition: optional
  note: "e.g. schemas eq \"urn:ietf:params:scim:schemas:extension:enterprise:2.0:User\""

- id: RFC7644-3.4.2.2-R14
  rfc: "7644"
  section: "3.4.2.2"
  title: "Invalid filter syntax, unrecognized filter operator, or unsupported attribute-operator combination returns HTTP 400 with scimType invalidFilter"
  level: MUST
  capability: filter
  observability: response
  disposition: optional
  note: "Malformed filter expression, unrecognized operator, or ordering operator (gt/ge/lt/le) on Boolean/Binary attribute returns 400 invalidFilter"

- id: RFC7644-3.4.2.2-R15
  rfc: "7644"
  section: "3.4.2.2"
  title: "Filter comparison on defaulted attribute uses value returned to creating client"
  level: MUST
  capability: filter
  observability: behavior
  disposition: optional
  note: "Defaulted attribute filter evaluates against initial defaulted value"

- id: RFC7644-3.4.2.3-R1
  rfc: "7644"
  section: "3.4.2.3"
  title: "Sorting ascending orders results in ascending order"
  level: MUST
  capability: sort
  observability: response
  disposition: optional
  note: "sortOrder=ascending"

- id: RFC7644-3.4.2.3-R2
  rfc: "7644"
  section: "3.4.2.3"
  title: "Sorting descending orders results in descending order"
  level: MUST
  capability: sort
  observability: response
  disposition: optional
  note: "sortOrder=descending"

- id: RFC7644-3.4.2.3-R3
  rfc: "7644"
  section: "3.4.2.3"
  title: "Default sort order when omitted is ascending"
  level: MUST
  capability: sort
  observability: response
  disposition: optional
  note: "When sortBy is specified without sortOrder, default is ascending"

- id: RFC7644-3.4.2.3-R4
  rfc: "7644"
  section: "3.4.2.3"
  title: "Sort order places missing data last for ascending and first for descending"
  level: MUST
  capability: sort
  observability: response
  disposition: optional
  note: "Null / unassigned values sorted last in ascending order and first in descending order"

- id: RFC7644-3.4.2.3-R5
  rfc: "7644"
  section: "3.4.2.3"
  title: "Sort by multi-valued attribute orders by primary value, if any, or else first value"
  level: MUST
  capability: sort
  observability: response
  disposition: optional
  note: "Sort on multi-valued attribute uses primary value or first element"

- id: RFC7644-3.4.2.4-R1
  rfc: "7644"
  section: "3.4.2.4"
  title: "Pagination startIndex 1-based index default is 1 and values less than 1 interpreted as 1"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "1-based indexing; startIndex < 1 becomes 1"

- id: RFC7644-3.4.2.4-R2
  rfc: "7644"
  section: "3.4.2.4"
  title: "Pagination count specifies maximum results; server MUST NOT return more than specified"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "itemsPerPage <= requested count; server MAY return fewer"

- id: RFC7644-3.4.2.4-R3
  rfc: "7644"
  section: "3.4.2.4"
  title: "Negative pagination count SHALL be interpreted as 0"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Negative count returns 0 items in page"

- id: RFC7644-3.4.2.4-R4
  rfc: "7644"
  section: "3.4.2.4"
  title: "startIndex and itemsPerPage are REQUIRED when partial results returned due to pagination"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "ListResponse includes startIndex and itemsPerPage when paging"

- id: RFC7644-3.4.2.5-R1
  rfc: "7644"
  section: "3.4.2.5"
  title: "attributes parameter restricts returned attributes to specified set plus minimum set"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Projections: requested attributes plus always-returned attributes"

- id: RFC7644-3.4.2.5-R2
  rfc: "7644"
  section: "3.4.2.5"
  title: "excludedAttributes parameter removes specified attributes from default returned set"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Attribute exclusion; always-returned attributes cannot be excluded"

- id: RFC7644-3.4.2.5-R3
  rfc: "7644"
  section: "3.9"
  title: "attributes and excludedAttributes are mutually exclusive"
  level: SHOULD
  capability: none
  observability: response
  disposition: tested
  note: "RFC 7644 §3.4.2.5 / §3.9 define attributes and excludedAttributes as mutually exclusive client parameters; providing both SHOULD return 400"

- id: RFC7644-3.4.3-R1
  rfc: "7644"
  section: "3.4.3"
  title: "POST to /.search returns HTTP 200 with ListResponse matching SearchRequest"
  level: MUST
  capability: search
  observability: response
  disposition: optional
  note: "SearchRequest body supporting filter, sortBy, pagination, and projection"

- id: RFC7644-3.5.1-R1
  rfc: "7644"
  section: "3.5.1"
  title: "PUT replaces existing resource representation in its entirety"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Full replace semantics; supplied attributes replace existing attributes"

- id: RFC7644-3.5.1-R2
  rfc: "7644"
  section: "3.5.1"
  title: "Omitted readWrite attributes in PUT MAY be cleared or assigned default values"
  level: MAY
  capability: none
  observability: behavior
  disposition: tested
  note: "RFC 7644 §3.5.1 MAY: Omitted readWrite attributes may be cleared/defaulted (aborts if server retains omitted attributes)"

- id: RFC7644-3.5.1-R3
  rfc: "7644"
  section: "3.5.1"
  title: "Client-supplied readOnly attributes in PUT SHALL be ignored"
  level: MUST
  capability: none
  observability: behavior
  disposition: tested
  note: "Modifying readOnly attributes like id or meta.created on PUT is ignored (RFC 7644 §3.5.1)"

- id: RFC7644-3.5.2-R1
  rfc: "7644"
  section: "3.5.2"
  title: "PATCH request SHALL be treated as atomic transaction"
  level: MUST
  capability: patch
  observability: behavior
  disposition: optional
  note: "If any operation fails, original resource MUST be restored"

- id: RFC7644-3.5.2-R2
  rfc: "7644"
  section: "3.5.2"
  title: "PATCH Operations array MUST contain one or more operation objects"
  level: MUST
  capability: patch
  observability: response
  disposition: optional
  note: "Empty Operations array returns 400 Bad Request"

- id: RFC7644-3.5.2-R3
  rfc: "7644"
  section: "3.5.2"
  title: "Each PATCH operation object MUST have exactly one op member"
  level: MUST
  capability: patch
  observability: response
  disposition: optional
  note: "Operation missing op or containing multiple op members returns 400"

- id: RFC7644-3.5.2-R4
  rfc: "7644"
  section: "3.5.2"
  title: "PATCH response MUST return HTTP 200 with representation or MAY return HTTP 204"
  level: MUST
  capability: patch
  observability: response
  disposition: optional
  note: "Server returns 200 with body or 204 No Content"

- id: RFC7644-3.5.2-R5
  rfc: "7644"
  section: "3.5.2"
  title: "PATCH with attributes query parameter MUST return HTTP 200 OK"
  level: MUST
  capability: patch
  observability: response
  disposition: optional
  note: "When attributes parameter specified, server cannot return 204"

- id: RFC7644-3.5.2-R6
  rfc: "7644"
  section: "3.5.2"
  title: "PATCH setting primary true SHALL automatically set primary false for any other values"
  level: MUST
  capability: patch
  observability: behavior
  disposition: optional
  note: "Multi-valued primary unset rule"

- id: RFC7644-3.5.2.1-R1
  rfc: "7644"
  section: "3.5.2.1"
  title: "PATCH add operation MUST contain value member"
  level: MUST
  capability: patch
  observability: response
  disposition: optional
  note: "add without value returns 400 invalidValue"

- id: RFC7644-3.5.2.1-R2
  rfc: "7644"
  section: "3.5.2.1"
  title: "PATCH add appends to multi-valued attribute or sets single-valued attribute"
  level: MUST
  capability: patch
  observability: response
  disposition: optional
  note: "Appends elements to existing array"

- id: RFC7644-3.5.2.1-R3
  rfc: "7644"
  section: "3.5.2.1"
  title: "PATCH add without path adds attributes specified in value object to target resource"
  level: MUST
  capability: patch
  observability: response
  disposition: optional
  note: "Pathless add merges attributes into resource"

- id: RFC7644-3.5.2.2-R1
  rfc: "7644"
  section: "3.5.2.2"
  title: "PATCH remove without path returns HTTP 400 with scimType noTarget"
  level: MUST
  capability: patch
  observability: response
  disposition: optional
  note: "Path is required for remove operation"

- id: RFC7644-3.5.2.2-R2
  rfc: "7644"
  section: "3.5.2.2"
  title: "PATCH remove with path clears single-valued attribute or removes matching multi-valued items"
  level: MUST
  capability: patch
  observability: response
  disposition: optional
  note: "Removes attribute or filtered array entries"

- id: RFC7644-3.5.2.3-R1
  rfc: "7644"
  section: "3.5.2.3"
  title: "PATCH replace replaces existing attribute value"
  level: MUST
  capability: patch
  observability: response
  disposition: optional
  note: "Overwrites existing value"

- id: RFC7644-3.5.2.3-R2
  rfc: "7644"
  section: "3.5.2.3"
  title: "PATCH replace on absent target attribute is treated as add operation"
  level: MUST
  capability: patch
  observability: response
  disposition: optional
  note: "Target attribute not existing is created"

- id: RFC7644-3.6-R1
  rfc: "7644"
  section: "3.6"
  title: "DELETE returns HTTP 204 No Content on successful deletion"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Resource deleted with empty response body"

- id: RFC7644-3.6-R2
  rfc: "7644"
  section: "3.6"
  title: "DELETE on unknown resource ID and subsequent requests for deleted resource return HTTP 404 Not Found"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "DELETE on non-existent ID (§3.6 / §3.12 Table 8) and GET/DELETE after deletion return 404"

- id: RFC7644-3.6-R3
  rfc: "7644"
  section: "3.6"
  title: "Soft-deleted resources SHALL NOT be returned in query responses"
  level: MUST
  capability: none
  observability: behavior
  disposition: tested
  note: "Deleted resources excluded from queries"

- id: RFC7644-3.6-R4
  rfc: "7644"
  section: "3.6"
  title: "Service provider SHOULD NOT consider deleted resource in uniqueness conflict calculation"
  level: SHOULD
  capability: none
  observability: behavior
  disposition: tested
  note: "Re-creating resource with same unique attribute after deletion succeeds"

- id: RFC7644-3.6-R5
  rfc: "7644"
  section: "3.6"
  title: "DELETE supports If-Match header for conditional deletion"
  level: MAY
  capability: etag
  observability: response
  disposition: optional
  note: "Conditional DELETE returns 412 if version does not match"

- id: RFC7644-3.7-R1
  rfc: "7644"
  section: "3.7"
  title: "POST to /Bulk executes multiple resource operations in single request"
  level: MUST
  capability: bulk
  observability: response
  disposition: optional
  note: "BulkRequest containing Operations array"

- id: RFC7644-3.7-R2
  rfc: "7644"
  section: "3.7"
  title: "bulkId is REQUIRED for each operation when method is POST"
  level: MUST
  capability: bulk
  observability: response
  disposition: optional
  note: "Missing bulkId on POST operation returns 400"

- id: RFC7644-3.7-R3
  rfc: "7644"
  section: "3.7.3"
  title: "Bulk response echoes bulkId and location for created resources"
  level: MUST
  capability: bulk
  observability: response
  disposition: optional
  note: "Response operation includes bulkId and location"

- id: RFC7644-3.7-R4
  rfc: "7644"
  section: "3.7.2"
  title: "Bulk operations support bulkId cross-referencing in data and path"
  level: MUST
  capability: bulk
  observability: behavior
  disposition: optional
  note: "bulkId:id reference resolution across operations (§3.7.2) and circular reference processing (§3.7.1)"

- id: RFC7644-3.7-R5
  rfc: "7644"
  section: "3.7.3"
  title: "Bulk operations continue performing subsequent operations after partial failure"
  level: MUST
  capability: bulk
  observability: behavior
  disposition: optional
  note: "Server disregards partial failure and continues unless failOnErrors limit reached"

- id: RFC7644-3.7-R6
  rfc: "7644"
  section: "3.7.3"
  title: "Bulk operations stop and return when failOnErrors count exceeded"
  level: MUST
  capability: bulk
  observability: response
  disposition: optional
  note: "failOnErrors limit aborts remaining operations"

- id: RFC7644-3.7-R7
  rfc: "7644"
  section: "3.7"
  title: "Bulk operation supports version attribute for conditional updates"
  level: MAY
  capability: bulk
  observability: response
  disposition: optional
  note: "Per-op version ETag on PUT, PATCH, DELETE"

- id: RFC7644-3.7.4-R1
  rfc: "7644"
  section: "3.7.4"
  title: "Bulk payload exceeding maxOperations or maxPayloadSize returns HTTP 413 specifying limit"
  level: MUST
  capability: bulk
  observability: response
  disposition: optional
  note: "HTTP 413 Payload Too Large with exceeded limit in error body"

- id: RFC7644-3.8-R1
  rfc: "7644"
  section: "3.8"
  title: "Servers MUST accept requests and return JSON-structured responses using UTF-8"
  level: MUST
  capability: none
  observability: response
  disposition: tested
