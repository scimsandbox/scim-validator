# RFC 7643: SCIM Core Schema Specification Requirements Catalog
# Basis: RFC 7643 as published (September 2015) + Verified Errata (5368, 5606, 5990, 5991, 6004, 7522, 8415, 8417, 8435, 8450, 8471, 8472, 8475) + Reported Erratum (6000)
# Date: 2026-10-10

- id: RFC7643-2.1-R1
  rfc: "7643"
  section: "2.1"
  title: "Attribute names match ABNF ATTRNAME and are case-insensitive"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Attribute names are case-insensitive across queries and schemas"

- id: RFC7643-2.2-R1
  rfc: "7643"
  section: "2.2"
  title: "Schema attribute characteristics use valid enum values when present"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "type, mutability, returned, uniqueness belong to defined sets"

- id: RFC7643-2.2-R2
  rfc: "7643"
  section: "2.2"
  title: "Schema attribute characteristics apply default values when omitted"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "required=false, caseExact=false, mutability=readWrite, returned=default, uniqueness=none, type=string (RFC 7643 §2.2 defines these defaults when omitted; §2.2 defines multiValued as a Boolean plurality indicator without specifying an omission default, and §7/§8.7 declare multiValued explicitly on schema attributes)"

- id: RFC7643-2.2-R3
  rfc: "7643"
  section: "7"
  title: "Attribute mutability definitions (readOnly, readWrite, immutable, writeOnly) are enforced"
  level: MUST
  capability: none
  observability: behavior
  disposition: tested
  note: "RFC 7643 §2.2 / §7: readOnly cannot be modified; immutable cannot be modified once set"

- id: RFC7643-2.2-R4
  rfc: "7643"
  section: "7"
  title: "Attribute returned definitions (always, never, default, request) are honored"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "RFC 7643 §2.2 / §7: returned=never attributes like password are never returned in responses"

- id: RFC7643-2.2-R5
  rfc: "7643"
  section: "7"
  title: "Attribute uniqueness definitions (none, server, global) are enforced"
  level: SHOULD
  capability: none
  observability: behavior
  disposition: tested
  note: "RFC 7643 §2.2 / §7: server MAY reject duplicate values and global uniqueness values SHOULD be globally unique"

- id: RFC7643-2.2-R6
  rfc: "7643"
  section: "7"
  title: "Attribute caseExact definition is honored in case preservation and filter matching"
  level: MUST
  capability: filter
  observability: behavior
  disposition: optional
  note: "RFC 7643 §2.2 / §7: \"For attributes that are case exact, the server SHALL preserve case for any value submitted.\" Compound requirement covering case preservation for caseExact=true attributes and case-insensitive filtering for caseExact=false attributes per RFC 7644 §3.4.2.2 (kept as a single catalog entry to preserve the 159-requirement catalog schema)."

- id: RFC7643-2.2-R7
  rfc: "7643"
  section: "7"
  title: "Schema attribute canonicalValues declares applicable canonical types; server MAY restrict values"
  level: MAY
  capability: none
  observability: response
  disposition: optional
  note: "RFC 7643 §2.2 / §7: When applicable, schemas specify canonicalValues (e.g. work, home, other); servers MAY restrict values to canonical list (disposition optional prevents unadvertised canonicalValues from docking core coverage)"

- id: RFC7643-2.3-R1
  rfc: "7643"
  section: "2.3"
  title: "Value validation conforms to declared attribute data types"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Persisted attribute values MUST conform to declared RFC 7643 §2.3 data types; invalid input types (e.g. non-boolean string for boolean or primitive for complex) are rejected with HTTP 400 (invalidValue/invalidSyntax) or coerced/ignored per RFC 7644 §3.3 without persisting invalid types"

- id: RFC7643-2.3.5-R1
  rfc: "7643"
  section: "2.3.5"
  title: "dateTime attributes are formatted as XML dateTime according to ISO 8601"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "dateTime values (e.g. meta.created, meta.lastModified) follow ISO 8601"

- id: RFC7643-2.3.6-R1
  rfc: "7643"
  section: "2.3.6"
  title: "binary attributes are base64 encoded and case-exact"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Binary attributes must be base64 strings with caseExact=true per RFC 7643 §2.3.6 and Reported Erratum 6000"

- id: RFC7643-2.3.7-R1
  rfc: "7643"
  section: "2.3.7"
  title: "reference attributes contain valid URI ($ref) and target resource referenceTypes"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "References point to target SCIM resources or external URIs"

- id: RFC7643-2.3.7-R2
  rfc: "7643"
  section: "2.3.7"
  title: "Service providers MAY enforce referential integrity for reference attributes"
  level: MAY
  capability: none
  observability: behavior
  disposition: optional
  note: "Referential integrity enforcement is optional per RFC 7643 §2.3.7 (disposition optional prevents unadvertised cascading integrity from docking core coverage)"

- id: RFC7643-2.3.8-R1
  rfc: "7643"
  section: "2.3.8"
  title: "Complex attributes MUST NOT contain nested complex attributes (except Schema resource)"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Complex attributes cannot nest complex sub-attributes"

- id: RFC7643-2.4-R1
  rfc: "7643"
  section: "2.4"
  title: "Multi-valued complex attribute primary sub-attribute is boolean with at most one true"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "At most one value in a multi-valued set has primary set to true; default is false"

- id: RFC7643-2.4-R2
  rfc: "7643"
  section: "2.4"
  title: "Multi-valued complex attribute display sub-attribute is a human-readable string"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "RFC 7643 §2.4 defines display as a human-readable name with mutability 'readOnly', while §8.7.1 core schema definitions also use 'readWrite' or 'immutable' across multi-valued attributes"

- id: RFC7643-2.4-R3
  rfc: "7643"
  section: "2.4"
  title: "Service providers SHOULD NOT return duplicate (type, value) entries"
  level: SHOULD
  capability: none
  observability: response
  disposition: tested
  note: "De-duplication of multi-valued items"

- id: RFC7643-2.5-R1
  rfc: "7643"
  section: "2.5"
  title: "Unassigned attributes, null value, or empty array SHALL be considered equivalent in state"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "RFC 7643 §2.5: \"Unassigned attributes, the null value, or empty array (in the case of a multi-valued attribute) SHALL be considered to be equivalent in 'state'\"; service providers MAY omit unassigned attributes or return null/empty in responses (kept as a single catalog entry to preserve the 159-requirement catalog schema)."

- id: RFC7643-3-R1
  rfc: "7643"
  section: "3"
  title: "Resource representations MUST include non-empty schemas array of unique, resource-type-supported schema URIs"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Every resource carries valid schemas array with no duplicate or unknown URIs (RFC 7643 §3: 'The \"schemas\" attribute MUST only contain values defined as \"schema\" and \"schemaExtensions\" for the resource's defined \"resourceType\"')"

- id: RFC7643-3-R2
  rfc: "7643"
  section: "3"
  title: "Extended attributes MUST be in sub-structure keyed by schema URI without top-level leak"
  level: MUST
  capability: enterprise
  observability: response
  disposition: optional
  note: "Enterprise extension attributes isolated under extension URN"

- id: RFC7643-3.1-R1
  rfc: "7643"
  section: "3.1"
  title: "id attribute is server-issued, unique, case-exact, readOnly, returned always; client MUST NOT specify"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "bulkId is a reserved keyword; client cannot supply id on POST"

- id: RFC7643-3.1-R2
  rfc: "7643"
  section: "3.1"
  title: "externalId attribute is readWrite, case-exact, scoped to provisioning domain"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "externalId round-trips and preserves client case"

- id: RFC7643-3.1-R3
  rfc: "7643"
  section: "3.1"
  title: "meta.location is the resource URI (readOnly) and MUST match Content-Location (or 201 Location) header when present"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "meta.location contains resource URI and matches Content-Location / Location response header when returned"

- id: RFC7643-3.1-R4
  rfc: "7643"
  section: "3.1"
  title: "meta.version matches ETag HTTP response header and marks non-strong validators as weak with case-sensitive 'W/'"
  level: MUST
  capability: etag
  observability: response
  disposition: optional
  note: "meta.version mirrors ETag header; weak entity-tags use case-sensitive W/ prefix"

- id: RFC7643-3.1-R5
  rfc: "7643"
  section: "3.1"
  title: "meta.created and meta.lastModified are readOnly DateTimes assigned by service provider; initial lastModified MUST equal created"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Timestamps assigned by server and equal on initial creation; client values ignored"

- id: RFC7643-4.1.1-R1
  rfc: "7643"
  section: "4.1.1"
  title: "User userName is required, unique across server/global, and case-insensitive"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Core identifier for User resource"

- id: RFC7643-4.1.1-R2
  rfc: "7643"
  section: "4.1.1"
  title: "User password has mutability writeOnly and returned never"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Password cannot be read via API or leaked in query/error responses"

- id: RFC7643-4.1.1-R3
  rfc: "7643"
  section: "4.1.1"
  title: "User name complex attribute defines formatted, familyName, givenName, middleName, and honorific sub-attributes"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Name sub-attributes follow SCIM specification"

- id: RFC7643-4.1.1-R4
  rfc: "7643"
  section: "4.1.1"
  title: "User displayName, nickName, profileUrl, title, userType adhere to schema definitions"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Standard singular User attributes"

- id: RFC7643-4.1.1-R5
  rfc: "7643"
  section: "4.1.1"
  title: "User preferredLanguage, locale, timezone conform to standard formats"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "RFC 5646 language tags, IANA time zones"

- id: RFC7643-4.1.1-R6
  rfc: "7643"
  section: "4.1.1"
  title: "User active is a boolean indicating account administrative status"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Active status boolean true/false"

- id: RFC7643-4.1.1-R7
  rfc: "7643"
  section: "4.1.1"
  title: "User password modification via PUT and PATCH when changePassword is supported"
  level: MUST
  capability: changePassword
  observability: response
  disposition: optional
  note: "Password can be updated via PUT or PATCH and is never returned in response"

- id: RFC7643-4.1.2-R1
  rfc: "7643"
  section: "4.1.2"
  title: "User emails is multi-valued with canonical types (work, home, other) and primary"
  level: SHOULD
  capability: none
  observability: response
  disposition: tested
  note: "RFC 7643 §4.1.2 states canonical types (work, home, other) are typical values and service providers MAY define additional canonical types"

- id: RFC7643-4.1.2-R2
  rfc: "7643"
  section: "4.1.2"
  title: "User phoneNumbers is multi-valued with canonical types (work, home, mobile, fax, pager, other)"
  level: SHOULD
  capability: none
  observability: response
  disposition: tested
  note: "RFC 7643 §4.1.2 states phone number canonical types are typical values and service providers MAY define additional canonical types"

- id: RFC7643-4.1.2-R3
  rfc: "7643"
  section: "4.1.2"
  title: "User ims is multi-valued instant messaging addresses"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Instant messaging addresses"

- id: RFC7643-4.1.2-R4
  rfc: "7643"
  section: "4.1.2"
  title: "User photos is multi-valued and values MUST specify image file URIs"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Image file URIs with canonical types photo and thumbnail"

- id: RFC7643-4.1.2-R5
  rfc: "7643"
  section: "4.1.2"
  title: "User addresses country (when specified) MUST be in two-letter ISO 3166-1 alpha-2 format"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Country code validation per errata 5990/5991"

- id: RFC7643-4.1.2-R6
  rfc: "7643"
  section: "4.1.2"
  title: "User groups attribute is readOnly; membership changes MUST occur via Group resource"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Direct write to User groups attribute is ignored on POST/PUT"

- id: RFC7643-4.1.2-R7
  rfc: "7643"
  section: "4.1.2"
  title: "User roles and entitlements multi-valued attributes adhere to schema definitions"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "User roles and entitlements collections"

- id: RFC7643-4.1.2-R8
  rfc: "7643"
  section: "4.1.2"
  title: "User x509Certificates values contain exactly one DER-encoded certificate in base64"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Single DER certificate per element; sequence of certificates forbidden"

- id: RFC7643-4.2-R1
  rfc: "7643"
  section: "4.2"
  title: "Group displayName is REQUIRED"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Erratum 5368 confirms Group displayName required=true"

- id: RFC7643-4.2-R2
  rfc: "7643"
  section: "4.2"
  title: "Group members sub-attributes (value, $ref, type) are immutable"
  level: MUST
  capability: none
  observability: behavior
  disposition: tested
  note: "Members can be added/removed, but individual member sub-attributes cannot be modified"

- id: RFC7643-4.2-R3
  rfc: "7643"
  section: "4.2"
  title: "Group supports nested groups as members"
  level: MAY
  capability: none
  observability: behavior
  disposition: tested
  note: "Member type Group references another Group resource"

- id: RFC7643-4.3-R1
  rfc: "7643"
  section: "4.3"
  title: "Enterprise User extension attributes (employeeNumber, department, etc.) adhere to schema"
  level: MUST
  capability: enterprise
  observability: response
  disposition: optional
  note: "Standard Enterprise User extension schema definitions"

- id: RFC7643-4.3-R2
  rfc: "7643"
  section: "4.3"
  title: "Enterprise User manager complex attribute includes value ($ref) and readOnly displayName"
  level: SHOULD
  capability: enterprise
  observability: response
  disposition: optional
  note: "RFC 7643 §4.3 defines manager.value and $ref as RECOMMENDED, and displayName as OPTIONAL readOnly"

- id: RFC7643-5-R1
  rfc: "7643"
  section: "5"
  title: "ServiceProviderConfig attributes are all readOnly and include required capability flags"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "patch, bulk, filter, changePassword, sort, etag, authenticationSchemes"

- id: RFC7643-6-R1
  rfc: "7643"
  section: "6"
  title: "ResourceType representations declare name, endpoint, schema, and optional schemaExtensions"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "ResourceType name and endpoint are server-unique and case-exact per erratum 8475; schemaExtensions is optional"

- id: RFC7643-7-R1
  rfc: "7643"
  section: "7"
  title: "Schema resources are readOnly and define full attribute characteristics"
  level: MUST
  capability: none
  observability: response
  disposition: tested
  note: "Schema definitions for all resource schemas; representations include schemas and meta per erratum 8417"

- id: RFC7643-9.2-R1
  rfc: "7643"
  section: "9.2"
  title: "Passwords MUST NOT be stored cleartext (hashed or encrypted per erratum 8450)"
  level: MUST
  capability: none
  observability: internal
  disposition: na
  note: "Non-observable via API directly; protected by returned=never and secure hashing"
