# RFC 9865 — SCIM 2.0 Cursor-Based Pagination Normative Requirement Catalog
# Basis: RFC 9865 (October 2025)
# Stable IDs follow: RFC9865-<section>-<sequence>

- id: RFC9865-2-R1
  rfc: "9865"
  section: "2"
  title: "Clients MAY request cursor-based pagination using the cursor query parameter"
  level: MAY
  capability: cursorPagination
  observability: response
  disposition: tested
  note: "Clients specify cursor parameter on GET or in SearchRequest"

- id: RFC9865-2-R2
  rfc: "9865"
  section: "2"
  title: "Service providers supporting cursor pagination return nextCursor in ListResponse"
  level: MUST
  capability: cursorPagination
  observability: response
  disposition: tested
  note: "nextCursor opaque string provided when more results remain"

- id: RFC9865-2-R3
  rfc: "9865"
  section: "2"
  title: "Service providers MAY return previousCursor in ListResponse"
  level: MAY
  capability: cursorPagination
  observability: response
  disposition: optional
  note: "previousCursor returned for reverse pagination where supported"
